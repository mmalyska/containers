# Build-time smoke test only, and deliberately non-executing. This image
# needs Jetson/Tegra GPU hardware to do anything meaningful (model load,
# CUDA offload) — but it needs that hardware just to *start* at all: the
# base image's libcuda.so.1 is a stub that only becomes a real library when
# NVIDIA's container runtime overlays the actual driver on real Jetson
# hardware. Running `llama-server --help` (or anything else that execs the
# binary) on any generic CI runner fails with "error while loading shared
# libraries" — confirmed first-hand, not hypothetical (this broke the build
# itself before the Dockerfile's own smoke check was switched to `test -x`).
# So this only proves the binary exists at the right path and is
# executable, never that it runs. Real verification happens by deploying to
# nv1 — see the plan this app was built for:
# docs/superpowers/plans/2026-09-28-llm-model-swap-lfm2.5.md (home-ops repo).
file:
  /usr/local/bin/llama-server:
    exists: true
    filetype: file
    mode: "0755"
