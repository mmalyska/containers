---
# https://github.com/aelsabbahy/goss/blob/master/docs/manual.md#command
command:
  ffmpeg:
    exec: ffmpeg -version
    exit-status: 0
  ffprobe:
    exec: ffprobe -version
    exit-status: 0
  exiftool:
    exec: exiftool -ver
    exit-status: 0
  imagick:
    exec: php -m
    exit-status: 0
    stdout:
      - imagick
  # No GPU in CI, so only check that the VAAPI driver and vainfo are installed.
  vaapi-driver:
    exec: ls /usr/lib/dri/iHD_drv_video.so
    exit-status: 0
  vainfo:
    exec: vainfo --help
    exit-status: 0
  # Samsung photos are HEIC. Alpine ships the ImageMagick HEIC coder in its own package.
  imagick-heic:
    exec: php -r 'echo implode(",", Imagick::queryFormats("HEIC"));'
    exit-status: 0
    stdout:
      - HEIC
  # go-vod's HDR graph downloads 4K frames before scaling; the wrapper must put scale_vaapi first.
  memories-ffmpeg-rewrite:
    exec: MEMORIES_FFMPEG_REAL=echo /usr/local/bin/memories-ffmpeg -vf hwdownload,format=p010le,scale=w=854:h=854,zscale=t=linear
    exit-status: 0
    stdout:
      - "fps=30,scale_vaapi=w=854:h=854:format=p010,hwdownload,format=p010le,zscale=t=linear"
  memories-ffmpeg-passthrough:
    exec: MEMORIES_FFMPEG_REAL=echo /usr/local/bin/memories-ffmpeg -vf scale_vaapi=w=1280:h=720:format=nv12
    exit-status: 0
    stdout:
      - "-vf scale_vaapi=w=1280:h=720:format=nv12"
