# Every tool in the image. Renovate bumps the versions.
[tools]

# Cluster, GitOps and infrastructure
kubectl = "1.37.2"
# kubectl looks up `kubectl browse-pvc` as kubectl-browse_pvc.
"github:clbx/kubectl-browse-pvc" = { version = "1.4.4", rename_exe = "kubectl-browse_pvc" }
helm = "4.3.1"
helmfile = "1.8.2"
kustomize = "5.8.3"
argocd = "3.5.7"
kubelogin = "1.36.4"
k9s = "0.51.0"
stern = "1.35.0"
"github:envoyproxy/gateway" = { version = "1.9.3", bin_path = "bin/linux/{{ arch(x64=\"amd64\") }}" }
talosctl = "1.14.4"
cilium-cli = "0.20.1"
terraform = "1.17.1"
age = "1.3.2"

# Secrets, AI and workspace
bitwarden-secrets-manager = "2.1.0"
coder = "2.38.5"
codex = "0.166.0"
claude = "2.1.316"
chezmoi = "2.74.0"
direnv = "2.38.2"
gh = "2.103.3"

# Build, lint and docs
task = "3.54.0"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
cue = "0.17.1"
goss = "0.3.21"
jq = "1.8.2"
# rsync has no mise registry entry; the conda backend installs conda-forge's build.
"conda:rsync" = "3.5.1"
yq = "4.54.1"
node = "26.13.0"
go = "1.27.3"
python = "3.12.16"
uv = "0.13.6"
"pypi:pre-commit" = "4.7.0"
"pypi:yamllint" = "1.38.0"
"pypi:mkdocs" = { version = "1.6.1", with = ["mkdocs-material==9.8.0", "mkdocs-git-revision-date-localized-plugin==1.6.3", "mkdocs-autolinks-plugin==0.7.1"] }
"npm:prettier" = "3.9.10"
"npm:markdownlint-cli" = "0.50.0"
