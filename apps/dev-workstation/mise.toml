# Every tool in the image. Renovate bumps the versions.
[tools]

# Cluster, GitOps and infrastructure
kubectl = "1.37.2"
# kubectl looks up `kubectl browse-pvc` as kubectl-browse_pvc.
"github:clbx/kubectl-browse-pvc" = { version = "1.4.4", rename_exe = "kubectl-browse_pvc" }
helm = "4.3.2"
helmfile = "1.8.4"
kustomize = "5.8.3"
argocd = "3.6.1"
kubelogin = "1.36.4"
k9s = "0.51.0"
stern = "1.35.0"
"github:envoyproxy/gateway" = { version = "1.10.0", bin_path = "bin/linux/{{ arch(x64=\"amd64\") }}" }
talosctl = "1.14.6"
cilium-cli = "0.20.3"
terraform = "1.17.2"
age = "1.3.2"
# Schema checks of rendered manifests (home-ops `task lint:manifests`).
kubeconform = "0.8.0"
# Prometheus rule checks and tests; keep it on the cluster's Prometheus version.
promtool = "3.16.0"

# Secrets, AI and workspace
bitwarden-secrets-manager = "2.1.0"
coder = "2.39.4"
codex = "0.166.0"
claude = "2.1.325"
chezmoi = "2.74.1"
direnv = "2.38.2"
gh = "2.105.0"

# Build, lint and docs
task = "3.54.0"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
cue = "0.17.1"
goss = "0.4.10"
jq = "1.8.2"
# rsync has no mise registry entry; the conda backend installs conda-forge's build.
"conda:rsync" = "3.5.2"
yq = "4.54.3"
node = "26.13.1"
go = "1.27.4"
python = "3.15.2"
uv = "0.13.8"
"pypi:pre-commit" = "4.7.0"
"pypi:yamllint" = "1.38.0"
"pypi:mkdocs" = { version = "1.6.1", with = ["mkdocs-material==9.8.0", "mkdocs-git-revision-date-localized-plugin==1.6.3", "mkdocs-autolinks-plugin==0.7.1"] }
"npm:prettier" = "3.10.1"
"npm:markdownlint-cli" = "0.50.0"
